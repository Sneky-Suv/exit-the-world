<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выход из мира</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #333;
            display: flex; justify-content: center; align-items: center;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 1;
        }
        .screen.active { display: flex; }

        /* ====== ЭКРАН 1: СТАРТ ====== */
        #start-screen { background: #ffffff; }
        #start-screen h1 {
            font-size: 26px; margin-bottom: 40px; color: #111; padding: 0 20px;
        }
        .start-buttons { position: relative; width: 100%; height: 150px; }
        .btn-yes, .btn-no {
            position: absolute; border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer;
            font-family: inherit;
        }
        .btn-yes {
            background: #4caf50; color: #fff;
            font-size: 32px; padding: 20px 60px;
            left: 50%; transform: translateX(-50%);
            top: 20px; z-index: 2;
        }
        .btn-no {
            background: #e53935; color: #fff;
            font-size: 20px; padding: 12px 40px;
            left: 50%; transform: translateX(-50%);
            top: 100px; z-index: 1;
            transition: none;
        }

        /* ====== ЭКРАН 2: ИГРА ====== */
        #game-screen { 
            background: #eaf4fb; /* Мягкий голубой */
            border: 10px solid #ff69b4;
            box-sizing: border-box;
        }
        #game-screen .hud {
            position: absolute; top: 15px; left: 20px; font-size: 22px;
            font-weight: bold; color: #333; z-index: 5;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px; border-radius: 20px;
        }
        
        /* Красное большое сердце */
        .player-heart {
            position: absolute; bottom: 80px;
            width: 60px; height: 60px;
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-size: 55px;
            color: red;
            line-height: 1;
        }

        .bullet {
            position: absolute; font-size: 30px; z-index: 8;
            color: red;
            line-height: 1;
        }
        .enemy {
            position: absolute; font-size: 30px; z-index: 6;
            transition: opacity 0.8s ease, transform 0.8s ease, color 0.3s;
        }
        .enemy.hit {
            color: #b06bff !important;
            opacity: 0;
            transform: translateY(-100px); /* Летит ВВЕРХ */
        }

        /* ====== ЭКРАН 3: ФИНАЛ ====== */
        #final-screen {
            background-color: #ffb6c1;
            transition: background-color 0.6s ease;
        }
        #final-screen.darkened { background-color: #d17b8a; }
        #final-screen.lightened { background-color: #ffd6de; }

        .heart-bg {
            position: absolute; color: #ff69b4; opacity: 0.35;
            user-select: none; pointer-events: none; z-index: 0;
        }
        .h1  { top: 4%;  left: 6%;    font-size: 28px; }
        .h2  { top: 10%; right: 10%;  font-size: 16px; }
        .h3  { top: 20%; left: 4%;    font-size: 38px; }
        .h4  { top: 28%; right: 5%;   font-size: 22px;}
        .h5  { top: 40%; left: 10%;   font-size: 14px; }
        .h6  { top: 48%; right: 8%;   font-size: 30px; }
        .h7  { top: 60%; left: 6%;    font-size: 18px; }
        .h8  { top: 70%; right: 7%;   font-size: 24px; }
        .h9  { top: 80%; left: 12%;   font-size: 32px; }
        .h10 { top: 90%; right: 14%;  font-size: 15px; }
        .h11 { top: 95%; left: 38%;   font-size: 20px; }
        .h12 { top: 6%;  right: 38%;  font-size: 14px; }
        .h13 { top: 14%; left: 25%;   font-size: 12px; }
        .h14 { top: 18%; right: 28%;  font-size: 20px; }
        .h15 { top: 34%; left: 2%;    font-size: 16px; }
        .h16 { top: 36%; right: 2%;   font-size: 12px; }
        .h17 { top: 55%; left: 2%;    font-size: 22px; }
        .h18 { top: 58%; right: 3%;   font-size: 14px; }
        .h19 { top: 76%; left: 3%;    font-size: 12px; }
        .h20 { top: 84%; right: 3%;   font-size: 26px; }
        .h21 { top: 97%; left: 8%;    font-size: 14px; }
        .h22 { top: 97%; right: 8%;   font-size: 18px; }

        .final-container {
            position: relative; z-index: 1;
            padding: 20px; width: 100%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Центральный смайл */
        .center-emoji {
            font-size: 80px;
            margin-bottom: 30px;
            animation: tgPop 0.4s ease-out;
            display: inline-block;
            transition: transform 0.2s;
        }
        .center-emoji.wiggle {
            animation: wiggle 1.2s ease-in-out infinite;
        }
        @keyframes tgPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .final-buttons {
            display: flex; flex-direction: column; gap: 15px; align-items: center;
            width: 100%;
        }
        .final-btn {
            background: rgba(255,255,255,0.7);
            border: 3px solid #4a90e2; color: #4a90e2;
            font-size: 20px; font-weight: 600; cursor: pointer;
            padding: 14px 40px; border-radius: 50px;
            width: 100%; max-width: 280px;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .final-btn:active { background: #4a90e2; color: #fff; }

        /* ====== ЭКРАН 4: НЕДОСТУПНО ====== */
        #unavailable-screen { background-color: #ffb6c1; }
        .unavailable-container {
            position: relative; z-index: 1;
            padding: 20px; max-width: 400px; width: 100%;
        }
        .icon-circle {
            width: 120px; height: 120px;
            background-color: #4a90e2; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 30px auto; font-size: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .unavailable-container h1 {
            font-size: 28px; font-weight: bold;
            margin-bottom: 15px; color: #111;
        }
        .unavailable-container p {
            font-size: 16px; color: #222;
            line-height: 1.5; margin-bottom: 40px; font-weight: 500;
        }
        .close-btn {
            background: transparent;
            border: 3px solid #4a90e2; color: #4a90e2;
            font-size: 18px; font-weight: 600; cursor: pointer;
            padding: 12px 40px; border-radius: 50px;
            transition: all 0.2s;
        }
        .close-btn:active { background: #4a90e2; color: #ffffff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Старт -->
    <div id="start-screen" class="screen active">
        <h1>Хочешь сыграть в игру?</h1>
        <div class="start-buttons">
            <button class="btn-yes"onclick="startGame()">Да</button>
            <button class="btn-no" id="btnNo" onmouseover="moveNoButton()" onclick="moveNoButton()">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Игра -->
    <div id="game-screen" class="screen">
        <div class="hud">Убито: <span id="score">0</span> / 30</div>
        <div id="game-field"></div>
    </div>

    <!-- ЭКРАН 3: Финал -->
    <div id="final-screen" class="screen">
        <span class="heart-bg h1">❤</span><span class="heart-bg h2">❤</span><span class="heart-bg h3">❤</span><span class="heart-bg h4">❤</span>
        <span class="heart-bg h5">❤</span><span class="heart-bg h6">❤</span><span class="heart-bg h7">❤</span><span class="heart-bg h8">❤</span>
        <span class="heart-bg h9">❤</span><span class="heart-bg h10">❤</span><span class="heart-bg h11">❤</span><span class="heart-bg h12">❤</span>
        <span class="heart-bg h13">❤</span><span class="heart-bg h14">❤</span><span class="heart-bg h15">❤</span><span class="heart-bg h16">❤</span>
        <span class="heart-bg h17">❤</span><span class="heart-bg h18">❤</span><span class="heart-bg h19">❤</span><span class="heart-bg h20">❤</span>
        <span class="heart-bg h21">❤</span><span class="heart-bg h22">❤</span>

        <div class="final-container">
            <span class="center-emoji wiggle" id="centerEmoji">👀</span>
            <div class="final-buttons">
                <button class="final-btn" id="btnStay" 
                        onmouseover="showEmoji('🤗')" 
                        onmouseout="resetEmoji()"
                        onclick="chooseStay()">Остаться в игре</button>
                <button class="final-btn" id="btnLeave" 
                        onmouseover="showEmoji('😭')" 
                        onmouseout="resetEmoji()"
                        onclick="chooseLeave()">Покинуть игру</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 4: Недоступно -->
    <div id="unavailable-screen" class="screen">
        <span class="heart-bg h1">❤</span><span class="heart-bg h2">❤</span><span class="heart-bg h3">❤</span><span class="heart-bg h4">❤</span>
        <span class="heart-bg h5">❤</span><span class="heart-bg h6">❤</span><span class="heart-bg h7">❤</span><span class="heart-bg h8">❤</span>
        <span class="heart-bg h9">❤</span><span class="heart-bg h10">❤</span><span class="heart-bg h11">❤</span><span class="heart-bg h12">❤</span>
        <span class="heart-bg h13">❤</span><span class="heart-bg h14">❤</span><span class="heart-bg h15">❤</span><span class="heart-bg h16">❤</span>
        <span class="heart-bg h17">❤</span><span class="heart-bg h18">❤</span><span class="heart-bg h19">❤</span><span class="heart-bg h20">❤</span>
        <span class="heart-bg h21">❤</span><span class="heart-bg h22">❤</span>

        <div class="unavailable-container">
            <div class="icon-circle">✋</div>
            <h1>Недоступно</h1>
            <p>Выход не доступен, так как вы не являетесь админом сервера. 😌</p>
            <button class="close-btn" onclick="closeApp()">Вернуться в мир</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ====== ЭКРАН 1: КНОПКА "НЕТ" ======
        let noButtonPositions = 0;
        const noPositions = [
            { top: '10px', left: '10%' },
            { top: '60px', left: '70%' },
            { top: '100px', left: '30%' }
        ];

        function moveNoButton() {
            const btn = document.getElementById('btnNo');
            if (noButtonPositions < 3) {
                const pos = noPositions[noButtonPositions];
                btn.style.top = pos.top;
                btn.style.left = pos.left;
                btn.style.transform = 'translateX(0)';
                noButtonPositions++;
            } else {
                btn.style.top = '100px';
                btn.style.left = '50%';
                btn.style.transform = 'translateX(-50%)';noButtonPositions = 0;
            }
        }

        // ====== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ======
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ====== ИГРА ======
        let score = 0;
        let gameRunning = false;
        const gameField = document.getElementById('game-field');
        let playerHeart = null;
        let bullets = [];
        let enemies = [];
        let heartX = 0;
        const heartWidth = 60;
        const borderSize = 10;

        function startGame() {
            showScreen('game-screen');
            score = 0;
            document.getElementById('score').innerText = score;
            gameRunning = true;
            gameField.innerHTML = '';
            
            playerHeart = document.createElement('div');
            playerHeart.className = 'player-heart';
            playerHeart.innerText = '❤';
            gameField.appendChild(playerHeart);

            heartX = (window.innerWidth - heartWidth) / 2;
            playerHeart.style.left = heartX + 'px';

            // Управление: свайп (мобилка) + мышь (ПК)
            let startX = 0;
            let startHeartX = 0;
            const gameScreen = document.getElementById('game-screen');

            gameScreen.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startHeartX = heartX;
            }, { passive: false });

            gameScreen.addEventListener('touchmove', (e) => {
                if (!gameRunning) return;
                e.preventDefault();
                const deltaX = e.touches[0].clientX - startX;
                let newHeartX = startHeartX + deltaX;
                newHeartX = Math.max(borderSize, Math.min(window.innerWidth - borderSize - heartWidth, newHeartX));
                heartX = newHeartX;
                playerHeart.style.left = heartX + 'px';
            }, { passive: false });

            // Мышь (ПК)
            gameScreen.addEventListener('mousemove', (e) => {
                if (!gameRunning) return;
                let newHeartX = e.clientX - heartWidth / 2;
                newHeartX = Math.max(borderSize, Math.min(window.innerWidth - borderSize - heartWidth, newHeartX));
                heartX = newHeartX;
                playerHeart.style.left = heartX + 'px';
            });

            setInterval(shootBullet, 500); // Быстрее
            setInterval(spawnEnemy, 1200);
            requestAnimationFrame(gameLoop);
        }

        function shootBullet() {
            if (!gameRunning) return;
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.innerText = '•';
            const heartCenterX = heartX + heartWidth / 2;
            bullet.style.left = (heartCenterX - 10) + 'px';
            bullet.style.bottom = '80px';
            gameField.appendChild(bullet);
            
            bullets.push({
                element: bullet,
                y: 80,
                speed: 6 // Быстрее
            });
        }

        function spawnEnemy() {
            if (!gameRunning) return;
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.innerText = '💛';
            enemy.style.left = Math.random() * 80 + 10 + '%';
            enemy.style.top = '-50px';
            gameField.appendChild(enemy);

            enemies.push({
                element: enemy,
                y: -50,
                speed: 1.5,
                hit: false
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Пульки вверх
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y += b.speed;
                b.element.style.bottom = b.y + 'px';if (b.y > window.innerHeight) {
                    b.element.remove();
                    bullets.splice(i, 1);
                }
            }

            // Миньоны вниз + проверка попаданий
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hit) continue;
                e.y += e.speed;
                e.element.style.transform = `translateY(${e.y}px)`;
                
                let wasHit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const enemyRect = e.element.getBoundingClientRect();
                    const bulletRect = b.element.getBoundingClientRect();
                    
                    if (
                        bulletRect.left < enemyRect.right &&
                        bulletRect.right > enemyRect.left &&
                        bulletRect.top < enemyRect.bottom &&
                        bulletRect.bottom > enemyRect.top
                    ) {
                        e.hit = true;
                        e.element.classList.add('hit');
                        b.element.remove();
                        bullets.splice(j, 1);
                        wasHit = true;
                        break;
                    }
                }

                if (wasHit) {
                    setTimeout(() => {
                        e.element.remove();
                        const idx = enemies.indexOf(e);
                        if (idx > -1) enemies.splice(idx, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        
                        if (score >= 30) {
                            endGame();
                        }
                    }, 800);
                    continue;
                }

                if (e.y > window.innerHeight) {
                    e.element.remove();
                    enemies.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            setTimeout(() => {
                showScreen('final-screen');
            }, 1000);
        }

        // ====== ЭКРАН 3: ЛОГИКА ======
        const centerEmoji = document.getElementById('centerEmoji');

        function showEmoji(emoji) {
            centerEmoji.innerText = emoji;
            centerEmoji.classList.remove('wiggle');
            centerEmoji.classList.remove('tgPop');
            void centerEmoji.offsetWidth; // Перезапуск анимации
            centerEmoji.classList.add('tgPop');
        }

        function resetEmoji() {
            centerEmoji.innerText = '👀';
            centerEmoji.classList.add('wiggle');
        }

        function chooseStay() {
            // Анимация смайла, потом действие
            centerEmoji.innerText = '🤗';
            centerEmoji.classList.remove('wiggle');
            centerEmoji.classList.add('tgPop');
            setTimeout(() => {
                tg.close();
            }, 800);
        }

        function chooseLeave() {
            centerEmoji.innerText = '😭';
            centerEmoji.classList.remove('wiggle');
            centerEmoji.classList.add('tgPop');
            setTimeout(() => {
                showScreen('unavailable-screen');
            }, 800);
        }

        // ====== ЭКРАН 4 ======
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
