<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Недоступно</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Розовый фон */
            background-color: #ffb6c1;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #333;
            position: relative;
            overflow: hidden;
        }

        /* Сердечки на фоне — расположены вручную, разных размеров */
        .heart {
            position: absolute;
            color: #ff69b4;
            opacity: 0.35;
            user-select: none;
            pointer-events: none;
            z-index: 0;
        }

        /* Позиции и размеры сердечек */
        .h1  { top: 5%;  left: 8%;   font-size: 22px; }
        .h2  { top: 12%; right: 12%;  font-size: 14px; }
        .h3  { top: 22%; left: 5%;   font-size: 30px; }
        .h4  { top: 30%; right: 6%;  font-size: 18px; }
        .h5  { top: 42%; left: 12%;  font-size: 12px; }
        .h6  { top: 50%; right: 10%; font-size: 26px; }
        .h7  { top: 62%; left: 7%;   font-size: 16px; }
        .h8  { top: 72%; right: 8%;  font-size: 20px; }
        .h9  { top: 82%; left: 15%;  font-size: 28px; }
        .h10 { top: 90%; right: 15%; font-size: 13px; }
        .h11 { top: 95%; left: 40%;  font-size: 18px; }
        .h12 { top: 8%;  right: 35%; font-size: 12px; }

        .container {
            padding: 20px;
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 1; /* Текст и кнопка поверх сердечек */
        }

        /* Синий круг с рукой */
        .icon-circle {
            width: 120px;
            height: 120px;
            background-color: #4a90e2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            font-size: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #111; /* Тёмный заголовок */
        }

        p {
            font-size: 16px;
            color: #222; /* Тёмный, хорошо читаемый текст */
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: 500;
        }

        /* Кнопка с обводкой (таблетка) */
        .close-btn {
            background: transparent;
            border: 3px solid #4a90e2;
            color: #4a90e2;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            padding: 12px 40px;
            border-radius: 50px;
            transition: all 0.2s;
        }

        .close-btn:active {
            background: #4a90e2;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Сердечки на фоне -->
    <span class="heart h1">❤</span>
    <span class="heart h2">❤</span>
    <span class="heart h3">❤</span>
    <span class="heart h4">❤</span>
    <span class="heart h5">❤</span>
    <span class="heart h6">❤</span>
    <span class="heart h7">❤</span>
    <span class="heart h8">❤</span>
    <span class="heart h9">❤</span>
    <span class="heart h10">❤</span>
    <span class="heart h11">❤</span>
    <span class="heart h12">❤</span>

    <div class="container">
        <div class="icon-circle">
            ✋
        </div>
        
        <h1>Недоступно</h1>
        
        <p>Выход не доступен, так как вы не являетесь админом сервера. 😔</p>
        
        <button class="close-btn" onclick="closeApp()">Вернуться в мир</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
