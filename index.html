<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Недоступен</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Розовый фон */
            background-color: #ffb6c1 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #333;
        }

        .container {
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        /* Стили для круга с рукой */
        .icon-circle {
            width: 120px;
            height: 120px;
            background-color: #4a90e2; /* Синий круг, как на скрине */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            font-size: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        /* Кнопка "Закрыть" */
  .close-btn {
    background: transparent;
    border: 3px solid #4a90e2;  /* Синяя обводка, как у круга */
    color: #4a90e2;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    padding: 12px 40px;         /* Чуть больше отступы, чтобы было похоже на кнопку */
    border-radius: 50px;         /* Закруглённые края, как у таблетки */
    transition: all 0.2s;
}

.close-btn:active {
    background: #4a90e2;         /* При нажатии кнопка заливается синим */
    color: #ffffff;              /* Текст становится белым */
}
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Смайлик руки в синем круге -->
        <div class="icon-circle">
            ✋
        </div>
        
        <!-- Заголовок -->
        <h1>Недоступно</h1>
        
        <!-- Текст с эмодзи -->
        <p>Выход не доступен, так как вы не являетесь админом сервера. 😔</p>
        
        <!-- Кнопка закрытия -->
        <button class="close-btn" onclick="closeApp()">Вернуться в мир</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Развернуть на весь экран

        // Функция закрытия приложения
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
